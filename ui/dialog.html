<!doctype html>
<html lang="en" data-lang="__MDM_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download File Info</title>
<link rel="icon" href="/favicon.ico">
<script>
  // Same theme as the main window (saved by its 🌓 button), applied before the first paint.
  try { const t = localStorage.getItem('mdm.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<script src="/i18n.js"></script>
<style>
  /* "Download File Info": the window that opens when a download link is caught.
     Layout follows the classic download-manager dialog (URL, category, Save As, description,
     file card, connections), colours are Mechano DM's own (v2 theme tokens). */
  :root {
    color-scheme: light;
    --bg: #f3f4f6; --panel: #ffffff; --raised: #f7f8fa; --text: #1f2328; --muted: #656d76;
    --line: #e2e5e9; --line-strong: #cdd2d8; --accent: #1f5bd8; --accent-2: #174ab3; --accent-soft: #e8effc;
    --ok: #1f9d55; --warn: #9a6700; --warn-soft: #fff6e0; --err: #cf222e; --on-accent: #fff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101214; --panel: #181b1f; --raised: #1f2328; --text: #e6e8eb; --muted: #959ca5;
    --line: #2a2f35; --line-strong: #3a4047; --accent: #5b8def; --accent-2: #7ba4f3; --accent-soft: #1c2a44;
    --ok: #3fb96a; --warn: #d29922; --warn-soft: #2b2414; --err: #f2575f; --on-accent: #0d131a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #101214; --panel: #181b1f; --raised: #1f2328; --text: #e6e8eb; --muted: #959ca5;
      --line: #2a2f35; --line-strong: #3a4047; --accent: #5b8def; --accent-2: #7ba4f3; --accent-soft: #1c2a44;
      --ok: #3fb96a; --warn: #d29922; --warn-soft: #2b2414; --err: #f2575f; --on-accent: #0d131a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--panel); color: var(--text); display: flex; flex-direction: column;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden; }
  :root[dir="rtl"] body { font-family: "Segoe UI Variable Text", "Segoe UI", Tahoma, system-ui, sans-serif; }
  input, select, button, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* header */
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .head img { width: 26px; height: 26px; }
  .head h1 { margin: 0; font: 600 15px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .head .count { margin-inline-start: auto; font-size: 12px; color: var(--muted); background: var(--raised); border: 1px solid var(--line);
    border-radius: 99px; padding: 2px 10px; }
  .head .count:empty { display: none; }

  /* body: file card + form */
  .body { flex: 1; display: grid; grid-template-columns: 148px 1fr; gap: 16px; padding: 16px 18px 12px; min-height: 0; overflow: auto; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--raised); text-align: center; align-self: start; }
  .type-icon { width: 76px; height: 92px; display: block; }
  .thumb { width: 124px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; background: var(--line); }
  .size { font: 600 16px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .size.unknown { font-size: 13px; color: var(--muted); font-weight: 400; }
  .facts { list-style: none; margin: 0; padding: 0; font-size: 11.5px; color: var(--muted); display: grid; gap: 2px; width: 100%; }
  .facts li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts .yes { color: var(--ok); } .facts .no { color: var(--warn); }

  .form { display: grid; grid-template-columns: auto 1fr; gap: 9px 10px; align-content: start; min-width: 0; }
  .form > label { font-size: 12.5px; color: var(--muted); align-self: center; white-space: nowrap; }
  .line { display: flex; gap: 6px; min-width: 0; align-items: center; }
  .line > * { min-width: 0; }
  .grow { flex: 1; }
  input[type=text], input[type=number], select { height: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 0 9px; width: 100%; }
  input[readonly] { background: var(--raised); color: var(--muted); }
  input:hover:not([readonly]), select:hover { border-color: var(--line-strong); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .ltr { direction: ltr; text-align: left; }
  :root[dir="rtl"] .ltr { text-align: right; unicode-bidi: plaintext; }
  #saveAs, #fileName { font-family: inherit; }
  #fileName { font-weight: 600; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .sub { grid-column: 2; margin-top: -3px; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; height: 32px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--line-strong); background: var(--raised); }
  button:disabled { opacity: .45; cursor: default; }
  button.icon { width: 34px; padding: 0; display: grid; place-items: center; flex: none; color: var(--muted); }
  button.icon:hover { color: var(--accent); }
  button.icon svg { width: 16px; height: 16px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .conn { display: flex; align-items: center; gap: 6px; }
  .conn input { width: 64px; text-align: center; }
  .hint { font-size: 11.5px; color: var(--muted); }

  /* info / warning bar */
  .note { margin: 0 18px 10px; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start;
    background: var(--accent-soft); color: var(--text); border: 1px solid transparent; }
  .note.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .note.err { background: color-mix(in srgb, var(--err) 12%, transparent); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
  .note[hidden] { display: none; }
  .note svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
  .note.warn svg { color: var(--warn); } .note.err svg { color: var(--err); } .note:not(.warn):not(.err) svg { color: var(--accent); }

  /* loading shimmer on the name while yt-dlp reads the page */
  .loading { position: relative; color: transparent !important; }
  .loading::after { content: ''; position: absolute; inset: 7px 9px; border-radius: 4px;
    background: linear-gradient(90deg, var(--line), var(--raised), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* footer */
  .foot { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-top: 1px solid var(--line); background: var(--raised); flex-wrap: wrap; }
  .foot .spacer { flex: 1; }

  /* own title bar when shown in Mechano DM's window: drag here; hide-to-tray, minimize, close */
  .winbtns { display: none; margin-inline-start: 8px; gap: 2px; }
  .own-frame .head { padding-block: 6px; padding-inline-end: 6px; user-select: none; cursor: default; }
  .own-frame .winbtns { display: flex; }
  .own-frame .head .count { margin-inline-start: auto; }
  .own-frame .head .count:empty + .winbtns { margin-inline-start: auto; }
  .winbtns button { width: 40px; height: 32px; border: 0; border-radius: 6px; background: transparent; padding: 0;
    display: grid; place-items: center; color: var(--muted); }
  .winbtns button:hover { background: var(--raised); color: var(--text); }
  .winbtns #wClose:hover { background: #c42b1c; color: #fff; }
  .winbtns svg { width: 16px; height: 16px; }

  /* progress view (after Start Download) */
  .prog { flex: 1; padding: 16px 20px 6px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .prog .pname { font: 600 14px/1.35 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog .purl { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -9px; }
  .bar { position: relative; height: 26px; border-radius: 7px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .6s ease; }
  :root[dir="rtl"] .bar .fill { inset: 0 0 0 auto; }
  .bar.ok .fill { background: var(--ok); }
  .bar.paused .fill { background: var(--warn); }
  .bar.err .fill { background: var(--err); }
  .bar.unknown .fill { width: 100% !important; opacity: .35;
    background: repeating-linear-gradient(45deg, var(--accent) 0 12px, transparent 12px 24px); background-size: 34px 34px; animation: stripes 1s linear infinite; }
  @keyframes stripes { to { background-position: 34px 0; } }
  .bar .pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; color: var(--text); }
  .stats { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 12px; font-size: 12.5px; }
  .stats dt { color: var(--muted); } .stats dd { margin: 0; font-weight: 600; }

  @media (max-width: 560px) {
    .body { grid-template-columns: 1fr; }
    .card { flex-direction: row; justify-content: flex-start; text-align: start; }
    .type-icon { width: 44px; height: 54px; } .thumb { width: 96px; }
    .form { grid-template-columns: 1fr; } .sub { grid-column: 1; }
  }
</style>
</head>
<body>
<div class="head">
  <img src="/logo.png?v=2" alt="">
  <h1>Download File Info</h1>
  <span class="count" id="count"></span>
  <span class="winbtns">
    <button type="button" id="wHide" title="Hide to the notification area" aria-label="Hide to the notification area" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    </button>
    <button type="button" id="wMin" title="Minimize" aria-label="Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button type="button" id="wClose" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </span>
</div>

<section class="prog" id="prog" hidden>
  <div class="pname" id="pName" translate="no"></div>
  <div class="purl ltr" id="pUrl" translate="no"></div>
  <div class="bar unknown" id="pBar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
    <div class="fill" id="pFill"></div><div class="pct" id="pPct" dir="ltr"></div>
  </div>
  <dl class="stats">
    <dt>Status</dt><dd id="pStatus">…</dd>
    <dt>Downloaded</dt><dd id="pDone" dir="ltr">…</dd>
    <dt>Speed</dt><dd id="pSpeed" dir="ltr">…</dd>
    <dt>Time left</dt><dd id="pEta" dir="ltr">…</dd>
  </dl>
</section>

<div class="body">
  <aside class="card" aria-label="File">
    <img class="thumb" id="thumb" alt="" hidden referrerpolicy="no-referrer">
    <svg class="type-icon" id="typeIcon" viewBox="0 0 76 92" aria-hidden="true">
      <path d="M6 2h46l22 22v62a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z" fill="var(--panel)" stroke="var(--line-strong)" stroke-width="2"/>
      <path d="M52 2v18a4 4 0 0 0 4 4h18" fill="var(--raised)" stroke="var(--line-strong)" stroke-width="2"/>
      <rect id="tiBand" x="2" y="50" width="54" height="24" rx="3" fill="var(--accent)"/>
      <text id="tiText" x="29" y="67" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#fff">FILE</text>
    </svg>
    <div class="size unknown" id="size" dir="ltr">…</div>
    <ul class="facts" id="facts"></ul>
  </aside>

  <form class="form" id="form" autocomplete="off" onsubmit="return false">
    <label for="url">URL</label>
    <div class="line">
      <input type="text" id="url" class="grow ltr" readonly translate="no" spellcheck="false">
      <button type="button" class="icon" id="copyUrl" title="Copy link" aria-label="Copy link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </div>

    <label for="category">Category</label>
    <div class="line">
      <select id="category" class="grow"></select>
      <span id="qualityWrap" class="line grow" hidden>
        <label for="quality" class="hint">Quality</label>
        <select id="quality" class="grow"></select>
      </span>
    </div>

    <label for="fileName" id="nameLabel">File name</label>
    <input type="text" id="fileName" class="ltr loading" translate="no" spellcheck="false" maxlength="200">

    <label for="saveAs">Save to</label>
    <div class="line">
      <input type="text" id="saveAs" class="grow ltr loading" translate="no" spellcheck="false">
      <button type="button" class="icon" id="browse" title="Choose folder" aria-label="Choose folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
    </div>
    <label class="check sub"><input type="checkbox" id="remember"> <span id="rememberText">Remember this path for "General" category</span></label>

    <label for="desc">Description</label>
    <input type="text" id="desc" maxlength="500" placeholder="Optional note for this download">

    <label for="conn" id="connLabel">Connections</label>
    <div class="conn" id="connRow">
      <input type="number" id="conn" min="1" max="32" value="8">
      <span class="hint" id="connHint">parts downloaded at the same time</span>
    </div>
  </form>
</div>

<div class="note" id="note" role="status" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
  <span id="noteText"></span>
</div>

<div class="foot">
  <label class="check"><input type="checkbox" id="dontAsk"> Don't ask again</label>
  <span class="spacer"></span>
  <button type="button" id="cancel">Cancel</button>
  <button type="button" id="later">Download Later</button>
  <button type="button" class="primary" id="start">Start Download</button>
</div>
<div class="foot" id="pFoot" hidden>
  <span class="hint" id="pHint">The download continues if you close this window.</span>
  <span class="spacer"></span>
  <button type="button" id="pPause">Pause</button>
  <button type="button" id="pClose">Close</button>
</div>

<script>
'use strict';
const TOKEN = '__MDM_TOKEN__';
const $ = (s) => document.querySelector(s);
const T = (s) => (window.MDM_I18N ? MDM_I18N.t(s) : s);
const params = new URLSearchParams(location.search);
const hostView = !!(window.chrome && window.chrome.webview);   // own window inside Mechano DM.exe
const framed = !hostView && window.parent !== window;            // iframe in the main page

async function api(path, body) {
  const res = await fetch(path, body === undefined ? { headers: { 'x-mdm-token': TOKEN } } :
    { method: 'POST', headers: { 'content-type': 'application/json', 'x-mdm-token': TOKEN }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const fmtBytes = (n) => { if (!n || !isFinite(n)) return ''; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i > 1 ? 2 : 0) + ' ' + u[i]; };
const fmtTime = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };

// ---------------------------------------------------------------- talking to whoever shows this page
function tellHost(msg) {
  if (hostView) window.chrome.webview.postMessage(msg);
  else if (framed) window.parent.postMessage({ mdm: 'dialog', ...msg }, location.origin);
}
function finished() {
  if (hostView || framed) tellHost({ type: 'done' });
  else window.close();
}
// Title bar colour of the app window follows the page theme
function themeIsDark() {
  const t = document.documentElement.dataset.theme;
  return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
}
tellHost({ type: 'theme', dark: themeIsDark() });

// Folder picker: the app window opens Windows' own dialog; elsewhere the engine does it.
let pickResolve = null;
if (hostView) {
  window.chrome.webview.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.type === 'folder' && pickResolve) { pickResolve(m.path || null); pickResolve = null; }
  });
}
function pickFolder(start) {
  if (hostView) return new Promise((r) => { pickResolve = r; tellHost({ type: 'browse', start }); });
  return api('/api/pick-folder', { start }).then((r) => r.path);
}

// ---------------------------------------------------------------- state
const CAT_COLORS = { Video: '#7c4dff', Music: '#1f9d55', Compressed: '#b26a00', Documents: '#1f5bd8', Programs: '#cf222e', Images: '#0e8a9a', General: '#656d76' };
let job = null, d = null, busy = false;
let folderAuto = '';      // folder we filled in ourselves (follows the category until you edit it)
let nameAuto = '';

// "Save to" holds the folder, "File name" the name only (hidden for playlists and torrents, which name themselves)
function current() { return { dir: $('#saveAs').value.trim().replace(/[\\/]+$/, ''), name: $('#fileName').value.trim() }; }
function nameRow(show) { $('#nameLabel').hidden = $('#fileName').hidden = !show; }
const BAD_NAME = /[\\/:*?"<>|]/;

function setNote(text, kind) {
  $('#note').hidden = !text;
  $('#note').className = 'note' + (kind ? ' ' + kind : '');
  $('#noteText').textContent = text ? T(text) : '';
}
function setBusy(b) {
  busy = b;
  for (const id of ['#start', '#later', '#browse']) $(id).disabled = b;
}
function setRememberText() {
  $('#rememberText').textContent = T(`Remember this path for "${$('#category').value}" category`);
}

function drawType(ext, cat) {
  const label = (ext || '').toUpperCase().slice(0, 5) || T('FILE');
  $('#tiText').textContent = label;
  $('#tiText').setAttribute('font-size', label.length > 4 ? 11 : 13);
  $('#tiBand').setAttribute('fill', CAT_COLORS[cat] || CAT_COLORS.General);
}

function fillFacts() {
  const li = [];
  const kind = d.playlist ? 'Playlist' : { direct: 'File', hls: 'Stream', ytdlp: 'Video site', torrent: 'Torrent' }[d.kind] || d.kind;
  li.push(`<li>${esc(T(kind))}${d.site ? ' · <span translate="no">' + esc(d.site) + '</span>' : ''}</li>`);
  if (d.duration) li.push(`<li>${esc(T('Length'))}: ${fmtTime(d.duration)}</li>`);
  if (d.resumable != null) li.push(`<li class="${d.resumable ? 'yes' : 'no'}">${esc(T(d.resumable ? 'Resume: Yes' : 'Resume: No'))}</li>`);
  $('#facts').innerHTML = li.join('');
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function showSize(n) {
  $('#size').textContent = n ? fmtBytes(n) : T('Size unknown');
  $('#size').classList.toggle('unknown', !n);
}

// ---------------------------------------------------------------- load
async function pickJob() {
  const list = (await api('/api/jobs')).filter((j) => j.status === 'confirm').sort((a, b) => a.createdAt - b.createdAt);
  const want = params.get('id');
  const j = want ? list.find((x) => x.id === want) : list[0];
  const pos = j ? list.indexOf(j) : -1;
  $('#count').textContent = list.length > 1 ? T(`${pos + 1} of ${list.length}`) : '';
  return j || null;
}

async function load() {
  setBusy(true);
  try { job = await pickJob(); } catch (e) { setNote(e.message, 'err'); return; }
  if (!job) { setNote('This download was already handled.', 'warn'); setTimeout(finished, 1200); return; }
  $('#url').value = job.url;
  $('#url').title = job.url;
  $('#fileName').value = job.filename || '';
  $('#category').innerHTML = `<option>${esc(T('General'))}</option>`; // real list arrives with the details
  showSize(job.total);
  drawType((job.filename || '').split('.').pop(), 'General');
  try {
    d = await api(`/api/jobs/${job.id}/details`, {});
  } catch (e) {
    $('#saveAs').classList.remove('loading'); $('#fileName').classList.remove('loading');
    setNote(e.message, 'warn');
    setBusy(false);
    return;
  }
  $('#saveAs').classList.remove('loading'); $('#fileName').classList.remove('loading');
  // categories
  const cat = $('#category');
  cat.innerHTML = '';
  for (const c of d.categories || []) {
    const o = document.createElement('option');
    o.value = c; o.textContent = T(c);
    cat.appendChild(o);
  }
  cat.value = d.category;
  // qualities (video sites)
  const q = $('#quality');
  q.innerHTML = '';
  for (const o of d.qualities || []) {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = T(o.label) + (o.size ? `  (${fmtBytes(o.size)})` : '');
    if (o.value === d.selected) opt.selected = true;
    q.appendChild(opt);
  }
  $('#qualityWrap').hidden = !(d.qualities && d.qualities.length);
  // Save As
  folderAuto = d.folder;
  nameAuto = d.fileName || d.name;
  $('#saveAs').value = d.folder;
  $('#fileName').value = nameAuto;
  nameRow(!d.playlist && d.kind !== 'torrent');
  $('#saveAs').title = d.playlist ? T('Playlist videos are saved in a folder here') : '';
  $('#remember').checked = (d.remembered || []).includes(d.category);
  setRememberText();
  $('#desc').value = d.description || '';
  $('#conn').value = d.connections || 8;
  const noConn = d.kind === 'torrent';
  $('#connLabel').hidden = $('#connRow').hidden = noConn;
  if (d.thumbnail) { $('#thumb').src = d.thumbnail; $('#thumb').hidden = false; $('#typeIcon').style.display = 'none'; }
  drawType(d.ext, d.category);
  showSize(selectedSize() || d.size);
  fillFacts();
  if (d.note) setNote(d.note, 'warn');
  else if (d.playlist) setNote('Playlist: every video is downloaded one after another. You can skip or re-order them in the main window.');
  setBusy(false);
  $('#start').focus();
}

function selectedSize() {
  if (!d || !d.qualities) return 0;
  const v = $('#quality').value;
  // "Best": the biggest video choice is what will be downloaded
  if (v === 'best') return Math.max(0, ...d.qualities.filter((x) => x.value !== 'audio' && x.size).map((x) => x.size));
  const o = d.qualities.find((x) => x.value === v);
  return o && o.size;
}

// ---------------------------------------------------------------- reactions
// Category → its folder, unless you typed your own folder.
$('#category').addEventListener('change', () => {
  const c = $('#category').value;
  const cur = current();
  if (d && (cur.dir === folderAuto || !cur.dir)) {
    folderAuto = d.categoryDirs[c];
    $('#saveAs').value = folderAuto;
  }
  $('#remember').checked = d ? (d.remembered || []).includes(c) : false;
  setRememberText();
  drawType(d && d.ext, c);
});

// Quality: audio → .mp3 in Music, video → .mp4 in Video
$('#quality').addEventListener('change', () => {
  if (!d) return;
  const audio = $('#quality').value === 'audio';
  const cur = current();
  if (!d.playlist && cur.name) {
    $('#fileName').value = cur.name.replace(/\.(mp4|mp3)$/i, '') + (audio ? '.mp3' : '.mp4');
  }
  const autoCat = audio ? 'Music' : 'Video';
  if ($('#category').value === 'Music' || $('#category').value === 'Video') {
    $('#category').value = autoCat;
    $('#category').dispatchEvent(new Event('change'));
  }
  d.ext = audio ? 'mp3' : 'mp4';
  drawType(d.ext, $('#category').value);
  showSize(selectedSize() || d.size);
});

$('#browse').addEventListener('click', async () => {
  setBusy(true);
  try {
    const cur = current();
    const p = await pickFolder(cur.dir || (d && d.folder) || '');
    if (p) $('#saveAs').value = p;
  } catch (e) { setNote(e.message, 'err'); }
  setBusy(false);
  $('#saveAs').focus();
});

// File name: warn about characters Windows doesn't allow; the type icon follows the extension
$('#fileName').addEventListener('input', () => {
  const v = $('#fileName').value;
  setNote(BAD_NAME.test(v) ? 'A file name can\'t contain \\ / : * ? " < > |' : '', 'warn');
  const dot = v.lastIndexOf('.');
  if (dot > 0) drawType(v.slice(dot + 1), $('#category').value);
});

$('#copyUrl').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('#url').value); setNote('Link copied.'); }
  catch { $('#url').select(); document.execCommand('copy'); }
});

// ---------------------------------------------------------------- finish
async function finish(action) {
  if (busy || !job) return;
  setBusy(true);
  try {
    if ($('#dontAsk').checked) await api('/api/config', { confirmDownloads: false });
    if (action === 'cancel') {
      await api(`/api/jobs/${job.id}/remove`, { deleteFiles: false });
    } else {
      const p = current();
      const body = { later: action === 'later', category: $('#category').value || undefined, description: $('#desc').value.trim() };
      if (!$('#fileName').hidden && p.name) {
        if (BAD_NAME.test(p.name)) throw new Error('A file name can\'t contain \\ / : * ? " < > |');
        if (p.name !== nameAuto) body.filename = p.name;
      }
      if (p.dir) {
        if (!/^([a-zA-Z]:[\\/]?|\\\\)/.test(p.dir)) throw new Error('Save to needs a full folder path, like D:\\Downloads');
        body.dir = /^[a-zA-Z]:$/.test(p.dir) ? p.dir + '\\' : p.dir;
        body.rememberPath = $('#remember').checked;
      }
      if (!$('#qualityWrap').hidden) body.quality = $('#quality').value;
      const n = Number($('#conn').value);
      if (!$('#connRow').hidden && n >= 1 && n <= 32 && (!d || n !== d.connections)) body.connections = n;
      // In the app window the dialog stays open and shows the progress (like IDM); tell the window
      // first so it doesn't close itself when the job leaves the "confirm" state.
      if (action === 'start' && hostView) tellHost({ type: 'starting' });
      try { await api(`/api/jobs/${job.id}/confirm`, body); }
      catch (e) { if (action === 'start' && hostView) tellHost({ type: 'start-failed' }); throw e; }
      if (action === 'start' && hostView) { showProgress(body.filename || current().name || job.filename); return; }
    }
    finished();
  } catch (e) {
    setBusy(false);
    setNote(e.message, 'err');
  }
}
$('#start').addEventListener('click', () => finish('start'));
$('#later').addEventListener('click', () => finish('later'));
$('#cancel').addEventListener('click', () => finish('cancel'));

// ---------------------------------------------------------------- progress view
let progress = false, progTimer = null, lastStatus = null;
const STATUS_TEXT = { queued: 'Waiting in queue', starting: 'Starting…', downloading: 'Downloading', paused: 'Paused',
  scheduled: 'Waiting for the scheduler', done: 'Download complete', error: 'Error' };

function showProgress(name) {
  progress = true;
  for (const s of ['.body', '#note', '.foot:not(#pFoot)']) $(s).hidden = true;
  $('#prog').hidden = $('#pFoot').hidden = false;
  $('#wHide').hidden = false;
  $('.head h1').textContent = T('Downloading');
  $('#count').textContent = '';
  $('#pName').textContent = name || job.url;
  $('#pName').title = name || '';
  $('#pUrl').textContent = job.url;
  tellHost({ type: 'progress', w: 560, h: 300 });
  tick();
  progTimer = setInterval(tick, 1000);
}

async function tick() {
  let j;
  try { j = (await api('/api/jobs')).find((x) => x.id === job.id); } catch { return; } // engine busy: next second
  if (!j) { clearInterval(progTimer); finished(); return; } // removed in the main window
  if (j.filename) { $('#pName').textContent = j.filename; $('#pName').title = j.filename; }
  const size = j.size || j.total || 0;
  const done = j.status === 'done' ? (size || j.downloaded) : (j.downloaded || 0);
  const pct = size ? Math.min(100, Math.floor(done / size * 100)) : null;
  const bar = $('#pBar');
  bar.className = 'bar' + (pct == null && j.status !== 'done' ? ' unknown' : '') +
    (j.status === 'done' ? ' ok' : j.status === 'paused' ? ' paused' : j.status === 'error' ? ' err' : '');
  $('#pFill').style.width = (j.status === 'done' ? 100 : pct || 0) + '%';
  $('#pPct').textContent = j.status === 'done' ? '100%' : pct == null ? '' : pct + '%';
  bar.setAttribute('aria-valuenow', pct == null ? '' : pct);
  document.title = (pct == null ? '' : pct + '% - ') + (j.filename || '');
  $('#pStatus').textContent = T(STATUS_TEXT[j.status] || j.status);
  $('#pDone').textContent = fmtBytes(done) ? fmtBytes(done) + (size ? ' / ' + fmtBytes(size) : '') : '—';
  const running = j.status === 'downloading';
  $('#pSpeed').textContent = running && j.speed ? fmtBytes(j.speed) + '/s' : '—';
  $('#pEta').textContent = running && j.eta != null && isFinite(j.eta) ? fmtTime(j.eta) : '—';
  $('#pPause').textContent = T(j.status === 'paused' ? 'Resume' : j.status === 'error' ? 'Retry' : 'Pause');
  $('#pPause').disabled = j.status === 'done' || j.status === 'scheduled';
  if (j.status === 'error') { $('#note').hidden = false; setNote(j.error || 'Error', 'err'); }
  else if (lastStatus === 'error') setNote('');
  if (j.status === 'done' && lastStatus !== 'done') {
    clearInterval(progTimer);
    setTimeout(finished, 900); // the "Download complete" window takes over
  }
  lastStatus = j.status;
}

$('#pPause').addEventListener('click', async () => {
  $('#pPause').disabled = true;
  try { await api(`/api/jobs/${job.id}/${lastStatus === 'paused' || lastStatus === 'error' ? 'resume' : 'pause'}`, {}); }
  catch (e) { $('#note').hidden = false; setNote(e.message, 'err'); }
  await tick();
});
$('#pClose').addEventListener('click', () => finished());

// own title bar (app window only): drag, hide to tray, minimize, close
if (hostView) {
  document.body.classList.add('own-frame');
  $('.head').addEventListener('mousedown', (e) => { if (e.button === 0 && !e.target.closest('button')) tellHost({ type: 'drag' }); });
  $('#wHide').addEventListener('click', () => tellHost({ type: 'hide' }));
  $('#wMin').addEventListener('click', () => tellHost({ type: 'minimize' }));
  // before Start, closing = Cancel (the window removes the job); after it, the download keeps going
  $('#wClose').addEventListener('click', () => (progress ? finished() : tellHost({ type: 'close' })));
}

document.addEventListener('keydown', (e) => {
  if (progress) { if (e.key === 'Escape') { e.preventDefault(); finished(); } return; }
  if (e.key === 'Escape') { e.preventDefault(); finish('cancel'); }
  else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT') { e.preventDefault(); finish('start'); }
});

load();
</script>
</body>
